name: Fee calculator browser
on:
  pull_request:
    paths:
      - 'fee-calculator/**'
      - 'shared/fees-calculator/**'
      - '.github/workflows/fee-calculator-browser.yml'
      - 'scripts/fee-calculator-browser.mjs'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fee-calculator-browser.mjs
