name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Verify suite
        run: node scripts/verify-suite.mjs
      - name: Regenerate bundles, format, and check for divergence
        run: |
          node scripts/bundle-tool.mjs --all
          npm run format
          git diff --exit-code -- '*/src/app.js' || {
            echo "FAIL: Bundles have diverged from shared modules. Regenerate with: node scripts/bundle-tool.mjs --all && npm run format"
            exit 1
          }
      - name: Validate storage keys
        run: node scripts/validate-storage-keys.mjs
