# Open Access UK: Possession Grounds (RRA 2025)

# Jurisdiction: England only
# Effective from: 1 May 2026
# Source: Renters' Rights Act 2025, Housing Act 1988 (as amended)

# Transition
# - Section 21 abolished 1 May 2026.
# - Pre-1 May 2026 Section 21 notices: court proceedings must be issued by 31 July 2026.
# - From 1 May 2026, all possession claims under the RRA use the revised Section 8 grounds below.

# Mandatory grounds
- id: rra-landlord-sale
  name: Landlord intends to sell
  notice_period: 2 months
  type: mandatory
  conditions: 'Landlord genuinely intends to sell. Cannot be used if owned <12 months.'
  source: 'RRA 2025 Sch.1'

- id: rra-landlord-move-in
  name: Landlord or family move in
  notice_period: 2 months
  type: mandatory
  conditions: 'Landlord, parent, child, sibling, or grandparent needs to occupy.'
  source: 'RRA 2025 Sch.1'

- id: rra-serious-arrears
  name: Serious rent arrears (3+ months)
  notice_period: 14 days
  type: mandatory
  conditions: 'At least 3 months rent arrears at notice and hearing. Replaces pre-RRA Ground 8 (2-month threshold).'
  source: 'RRA 2025 s.8'

# Discretionary grounds
- id: ground-10
  name: Some rent arrears
  notice_period: 14 days
  type: discretionary
  conditions: 'Rent arrears at time of notice and hearing (pre-RRA).'
  source: 'HA 1988 s.8'

- id: ground-14
  name: Nuisance or anti-social behaviour
  notice_period: 0 days
  type: discretionary
  conditions: 'Nuisance, ASB, or conviction. Proceedings may commence immediately.'
  source: 'HA 1988 s.8'
